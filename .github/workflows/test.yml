name: tests

on:
  pull_request:
  push:
    branches: [main, "phase/**"]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools and Vibe Kit
        run: python -m pip install -e ".[test]"
      - name: Configure git identity and default branch for fixture diversity
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Vibe CI"
          git config --global init.defaultBranch main
      - name: Run tests
        run: python -m pytest -q
      - name: Run strict doctor
        run: python -m vibe doctor --strict
      - name: Verify repository
        run: python -m vibe verify
      - name: Run Phase 28 gate
        run: python scripts/gate --phase 28
