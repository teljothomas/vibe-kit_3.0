name: Import V3 Phase 29

on:
  push:
    branches:
      - phase/29-governance-integrity
    paths:
      - ".bootstrap/phase29-final.part-*"
      - ".bootstrap/trigger-phase29"
      - "scripts/bootstrap_phase29.py"

permissions:
  contents: write

concurrency:
  group: vibe-kit-phase29-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase/29-governance-integrity
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Restore the Phase 29 source tree and commit it
        run: python scripts/bootstrap_phase29.py
